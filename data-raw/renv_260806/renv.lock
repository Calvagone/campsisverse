      "Description": "A collection of utilities extending the 'campsis' ecosystem, with a primary focus on sensitivity analysis and uncertainty visualization in pharmacometric workflows.  The package provides a framework for performing sensitivity analyses by systematically varying model parameters (e.g., increased and decreased values) and evaluating the resulting impact on model-derived outcomes. It also includes functionality to generate forest plots, enabling clear visualization of parameter uncertainty and its influence on key metrics.  These tools integrate seamlessly with 'campsis', 'campsismod' and 'campsisnca', supporting efficient simulation, analysis and interpretation workflows.",
